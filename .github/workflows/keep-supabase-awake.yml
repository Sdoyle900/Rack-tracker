name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://ldljqksuwzxyqngavvqq.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
